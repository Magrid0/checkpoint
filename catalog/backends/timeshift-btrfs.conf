SCHEMA_VERSION=2
BACKEND_ID=timeshift-btrfs
NAME="Timeshift (BTRFS)"
EMOJI=📸
STORAGE_FORMAT=btrfs
CAP_BOOTABLE_SUBVOL=true
CAP_PAIRED_PRE_POST=false

REQUIRES_CMD=timeshift
PROBE_ACTIVE_CMD="command -v timeshift >/dev/null 2>&1 && { [[ $(stat -f -c %T / 2>/dev/null) == 'btrfs' ]] || [[ -f /etc/timeshift.json && $(grep -q 'btrfs' /etc/timeshift.json 2>/dev/null; echo $?) -eq 0 ]]; }"
PRIORITY=10

CREATE_CMD='sudo timeshift --btrfs ${SNAPSHOT_DEVICE:+--snapshot-device "$SNAPSHOT_DEVICE"} --create --comments "$COMMENT" --verbose'
PRE_CREATE_CMD='sudo umount /run/timeshift/*/backup 2>/dev/null || true'
EXTRACT_ID_REGEX='[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}'
SUBVOL_PATH_TEMPLATE='/timeshift-btrfs/snapshots/${SNAPSHOT_ID}/@'
LIST_CMD='sudo timeshift --btrfs ${SNAPSHOT_DEVICE:+--snapshot-device "$SNAPSHOT_DEVICE"} --list --scripted'
DELETE_CMD='sudo timeshift --btrfs ${SNAPSHOT_DEVICE:+--snapshot-device "$SNAPSHOT_DEVICE"} --delete --snapshot "$SNAPSHOT" --scripted --yes'

LIST_PARSER='awk "match(\$0, /[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}/) { name=substr(\$0, RSTART, RLENGTH); comm=substr(\$0, RSTART + RLENGTH); gsub(/\\{[^}]*\\}|\\([^)]*\\)/, \"\", comm); sub(/^[ \\t]+/, \"\", comm); sub(/[ \\t]+\$/, \"\", comm); if (!comm) comm=\"(no description)\"; print name \" | \" comm; }"'
